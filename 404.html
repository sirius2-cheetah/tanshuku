<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirecting...</title>
  <style>
    :root {
      --bg: #050811;
      --card: rgba(13, 19, 34, 0.8);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #0ea5e9;
      --indigo: #6366f1;
      --red: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.18), transparent 45%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top-color: rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 36px 26px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(14, 165, 233, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.72s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.85rem;
      color: var(--sub);
      word-break: break-all;
      line-height: 1.55;
    }

    .btn-home {
      display: inline-block;
      margin-top: 22px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--accent), var(--indigo));
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);
    }

    .error-badge {
      display: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin: 0 auto 14px;
      width: fit-content;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="error-badge" id="errBadge">404 NOT FOUND</div>
    <h1 id="statusTitle">リダイレクト先を確認しています...</h1>
    <p id="statusDesc">しばらくお待ちください</p>
    <a href="/" class="btn-home" id="homeBtn" style="display: none;">トップページへ戻る</a>
  </div>

  <script>
    (async function () {
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyaiAF5iKZs5fQ9k4TYp2nwEOXyXLWFf3iDf4WxlMvQaQBxlUcLpYBdeL_8cEf14q3R/exec";

      const spinner = document.getElementById("spinner");
      const errBadge = document.getElementById("errBadge");
      const statusTitle = document.getElementById("statusTitle");
      const statusDesc = document.getElementById("statusDesc");
      const homeBtn = document.getElementById("homeBtn");

      function showNotFound(title, desc) {
        spinner.style.display = "none";
        errBadge.style.display = "block";
        statusTitle.textContent = title;
        statusDesc.textContent = desc;
        homeBtn.style.display = "inline-block";
      }

      const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, "");
      const slug = decodeURIComponent(rawPath);

      if (!slug) {
        window.location.replace("/");
        return;
      }

      try {
        const endpoint = `${GAS_WEB_APP_URL}?action=resolve&slug=${encodeURIComponent(slug)}`;
        const res = await fetch(endpoint);
        const data = await res.json();

        if (data.ok && data.url) {
          statusTitle.textContent = "移動しています...";
          statusDesc.textContent = data.url;
          window.location.replace(data.url);
        } else {
          showNotFound(
            "リンクが見つかりません",
            `指定された短縮URL「/${slug}」は存在しないか、すでに削除されています。`
          );
        }
      } catch (err) {
        showNotFound(
          "通信エラーが発生しました",
          "リダイレクトサーバーへの接続に失敗しました。時間をおいて再度お試しください。"
        );
      }
    })();
  </script>
</body>
</html>
