<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リンク宛先変更 | 短縮.top</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M26 38l12-12'/%3E%3Cpath d='M35 21l3-3a8.5 8.5 0 0 1 12 12l-3 3'/%3E%3Cpath d='M29 43l-3 3a8.5 8.5 0 0 1-12-12l3-3'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-sub: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, 0.1);
      --shadow: 0 14px 36px -10px rgba(15, 23, 42, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --surface: #111827;
        --surface-sub: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #1e293b;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --primary-soft: rgba(59, 130, 246, 0.15);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.12);
        --success: #4ade80;
        --success-soft: rgba(74, 222, 128, 0.12);
        --shadow: 0 14px 36px -10px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 490px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      display: grid;
      place-items: center;
      color: #ffffff;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .slug-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .slug-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .slug-prefix {
      padding: 11px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-sub);
      border-right: 1px solid var(--border);
      user-select: none;
      white-space: nowrap;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .slug-box input {
      border: none;
      border-radius: 0;
      box-shadow: none !important;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      background: var(--surface-sub);
    }

    .auth-box {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      animation: fade-in 0.2s ease;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: var(--surface-sub);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .auth-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 700;
      padding: 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .passkey-note {
      font-size: 0.82rem;
      color: var(--text-muted);
      background: var(--surface-sub);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.05s, opacity 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-sub);
    }

    .editor-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      animation: fade-in 0.2s ease;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .meta-item {
      background: var(--surface-sub);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.78rem;
    }

    .meta-label {
      color: var(--text-muted);
      font-weight: 700;
    }

    .meta-val {
      font-weight: 700;
      margin-top: 2px;
    }

    .current-box {
      background: var(--surface-sub);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }

    .current-label {
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .current-url {
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--text);
    }

    .alert {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      word-break: break-word;
    }

    .alert.error {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .alert.success {
      display: block;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.25);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-bar">
      <a href="/" class="brand">
        <span class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        短縮.top
      </a>
      <span class="badge">link-edit</span>
    </div>

    <h1>リンクの転送先を変更</h1>
    <p class="subtitle">パスキーまたはパスワードで保護されたリンクのみ編集できます。このページを利用することで、</p><a href=/../利用規約.html class="subtitle">利用規約</a><p class="subtitle">に同意したこととみなします。</p>

    <!-- ステップ1: ID検索 -->
    <div id="step-slug">
      <div class="field">
        <label for="slug-input">短縮スラッグ（ID）</label>
        <div class="slug-box">
          <span class="slug-prefix">短縮.top/</span>
          <input type="text" id="slug-input" placeholder="example" autocomplete="off" spellcheck="false" required>
        </div>
      </div>
      <button type="button" id="check-btn" class="btn">利用規約に同意して次へ（認証確認）</button>
    </div>

    <!-- ステップ2: 本人確認 -->
    <div id="step-auth" class="auth-box">
      <div id="auth-tabs" class="auth-tabs" role="tablist">
        <button type="button" id="tab-password" class="auth-tab active" data-mode="password">パスワード認証</button>
        <button type="button" id="tab-passkey" class="auth-tab" data-mode="passkey">パスキー認証</button>
      </div>

      <div id="password-area" class="field">
        <label for="password-input">設定済みパスワード</label>
        <input type="password" id="password-input" placeholder="リンク作成時に設定したパスワード" autocomplete="current-password">
      </div>

      <div id="passkey-area" class="passkey-note" style="display: none;">
        端末の生体認証（指紋・顔認証）またはセキュリティキーで本人確認を行います。
      </div>

      <button type="button" id="verify-btn" class="btn">認証して現在の設定を表示</button>
      <button type="button" id="back-slug-btn" class="btn btn-ghost">別のIDを入力する</button>
    </div>

    <!-- ステップ3: 宛先編集 -->
    <div id="step-editor" class="editor-section">
      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">クリック数</div>
          <div id="meta-clicks" class="meta-val">0</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">有効期限</div>
          <div id="meta-expires" class="meta-val">-</div>
        </div>
      </div>

      <div class="current-box">
        <div class="current-label">現在の転送先URL</div>
        <div id="current-url-text" class="current-url">-</div>
      </div>

      <div class="field">
        <label for="new-url-input">新しい転送先URL</label>
        <input type="url" id="new-url-input" placeholder="https://example.com/updated-page" required>
      </div>

      <div class="field">
        <label for="memo-input">メモ（任意）</label>
        <input type="text" id="memo-input" placeholder="管理用メモ">
      </div>

      <button type="button" id="save-btn" class="btn">新しい宛先を保存</button>
      <button type="button" id="reset-btn" class="btn btn-ghost">別のリンクを編集</button>
    </div>

    <div id="alert-box" class="alert" role="alert"></div>

    <div class="footer">
      <a href="/">← 短縮.top トップへ戻る</a>
    </div>
  </main>

  <script>
    // 既存のGAS WebアプリURLを設定してください
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyaiAF5iKZs5fQ9k4TYp2nwEOXyXLWFf3iDf4WxlMvQaQBxlUcLpYBdeL_8cEf14q3R/exec";

    let currentSlug = "";
    let lockMeta = { hasPassword: false, hasPasskey: false, passkeyId: "" };
    let authMode = "password";
    let savedPassword = "";

    const slugInput = document.getElementById("slug-input");
    const checkBtn = document.getElementById("check-btn");
    const stepAuth = document.getElementById("step-auth");
    const authTabs = document.getElementById("auth-tabs");
    const tabPassword = document.getElementById("tab-password");
    const tabPasskey = document.getElementById("tab-passkey");
    const passwordArea = document.getElementById("password-area");
    const passwordInput = document.getElementById("password-input");
    const passkeyArea = document.getElementById("passkey-area");
    const verifyBtn = document.getElementById("verify-btn");
    const backSlugBtn = document.getElementById("back-slug-btn");

    const stepEditor = document.getElementById("step-editor");
    const metaClicks = document.getElementById("meta-clicks");
    const metaExpires = document.getElementById("meta-expires");
    const currentUrlText = document.getElementById("current-url-text");
    const newUrlInput = document.getElementById("new-url-input");
    const memoInput = document.getElementById("memo-input");
    const saveBtn = document.getElementById("save-btn");
    const resetBtn = document.getElementById("reset-btn");
    const alertBox = document.getElementById("alert-box");

    // ?slug=xxx または ?id=xxx があれば自動入力
    const params = new URLSearchParams(location.search);
    const presetSlug = params.get("slug") || params.get("id");
    if (presetSlug) {
      slugInput.value = presetSlug.replace(/^\/+/, "");
    }

    function setAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = "alert " + type;
    }

    function clearAlert() {
      alertBox.textContent = "";
      alertBox.className = "alert";
    }

    function switchAuthMode(mode) {
      authMode = mode;
      tabPassword.classList.toggle("active", mode === "password");
      tabPasskey.classList.toggle("active", mode === "passkey");
      passwordArea.style.display = mode === "password" ? "block" : "none";
      passkeyArea.style.display = mode === "passkey" ? "block" : "none";
    }

    tabPassword.addEventListener("click", () => {
      clearAlert();
      switchAuthMode("password");
    });

    tabPasskey.addEventListener("click", () => {
      clearAlert();
      switchAuthMode("passkey");
    });

    function base64UrlToBuffer(base64url) {
      const padding = "=".repeat((4 - (base64url.length % 4)) % 4);
      const base64 = (base64url + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const buffer = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) {
        buffer[i] = raw.charCodeAt(i);
      }
      return buffer.buffer;
    }

    function bufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let str = "";
      for (const b of bytes) {
        str += String.fromCharCode(b);
      }
      return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    // 既存GASの GET ?action=challenge & verifyPasskeyAssertion に完全準拠したWebAuthn認証
    async function createPasskeyAssertionPayload(passkeyId) {
      if (!window.PublicKeyCredential) {
        throw new Error("このブラウザはパスキーに対応していません");
      }

      const chalRes = await fetch(GAS_ENDPOINT + "?action=challenge", {
        method: "GET"
      });
      const chalData = await chalRes.json();
      if (!chalData.ok || !chalData.challenge) {
        throw new Error("パスキー認証チャレンジの取得に失敗しました");
      }

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: base64UrlToBuffer(chalData.challenge),
          rpId: location.hostname,
          allowCredentials: [
            {
              type: "public-key",
              id: base64UrlToBuffer(passkeyId)
            }
          ],
          userVerification: "preferred",
          timeout: 60000
        }
      });

      return {
        authType: "passkey",
        assertion: {
          id: assertion.id,
          authenticatorData: bufferToBase64Url(assertion.response.authenticatorData),
          clientDataJSON: bufferToBase64Url(assertion.response.clientDataJSON),
          signature: bufferToBase64Url(assertion.response.signature)
        }
      };
    }

    async function buildAuthBody() {
      if (authMode === "passkey") {
        return await createPasskeyAssertionPayload(lockMeta.passkeyId);
      }
      const pw = passwordInput.value || savedPassword;
      if (!pw) {
        throw new Error("パスワードを入力してください");
      }
      savedPassword = pw;
      return {
        authType: "password",
        password: pw
      };
    }

    // ステップ1: リンク保護状態の確認
    checkBtn.addEventListener("click", async () => {
      clearAlert();
      const slug = slugInput.value.trim().replace(/^\/+/, "");
      if (!slug) {
        setAlert("編集するIDを入力してください", "error");
        return;
      }

      checkBtn.disabled = true;
      checkBtn.textContent = "確認中...";

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "edit_url",
            slug: slug
          })
        });
        const data = await res.json();

        if (!data.ok || !data.item) {
          setAlert(data.error || "認証に失敗したか、このリンクは編集対象外です", "error");
          return;
        }

        currentSlug = slug;
        lockMeta = {
          hasPassword: Boolean(data.item.hasPassword),
          hasPasskey: Boolean(data.item.hasPasskey),
          passkeyId: data.item.passkeyId || ""
        };

        // 設定されている認証方法に合わせてUIを最適化
        if (lockMeta.hasPassword && lockMeta.hasPasskey) {
          authTabs.style.display = "grid";
          switchAuthMode("passkey");
        } else if (lockMeta.hasPasskey) {
          authTabs.style.display = "none";
          switchAuthMode("passkey");
        } else {
          authTabs.style.display = "none";
          switchAuthMode("password");
        }

        slugInput.disabled = true;
        checkBtn.style.display = "none";
        stepAuth.style.display = "block";
      } catch (err) {
        setAlert("通信エラーが発生しました。時間をおいて再試行してください", "error");
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = "次へ（認証確認）";
      }
    });

    // ステップ2: 認証して現在の転送先を取得
    verifyBtn.addEventListener("click", async () => {
      clearAlert();
      verifyBtn.disabled = true;
      verifyBtn.textContent = "認証中...";

      try {
        const authBody = await buildAuthBody();
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "edit_url",
            mode: "lookup",
            slug: currentSlug,
            ...authBody
          })
        });
        const data = await res.json();

        if (!data.ok || !data.item) {
          setAlert(data.error || "認証に失敗したか、このリンクは編集対象外です", "error");
          return;
        }

        metaClicks.textContent = String(data.item.clicks || 0) + " 回";
        metaExpires.textContent = data.item.expires_at || "-";
        currentUrlText.textContent = data.item.url;
        newUrlInput.value = data.item.url;
        memoInput.value = data.item.memo || "";

        stepAuth.style.display = "none";
        stepEditor.style.display = "block";
      } catch (err) {
        if (err.name === "NotAllowedError") {
          setAlert("パスキー認証がキャンセルされました", "error");
        } else {
          setAlert(err.message || "認証に失敗したか、このリンクは編集対象外です", "error");
        }
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = "認証して現在の設定を表示";
      }
    });

    // ステップ3: 新しい転送先URLを保存
    saveBtn.addEventListener("click", async () => {
      clearAlert();
      const newUrl = newUrlInput.value.trim();
      const memo = memoInput.value;

      if (!/^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(newUrl)) {
        setAlert("有効なURL（http:// または https://）を入力してください", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "保存中...";

      try {
        // パスキーの場合はワンタイムチャレンジ消費済みのため、保存時も再度署名を取得
        const authBody = await buildAuthBody();
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "edit_url",
            mode: "update",
            slug: currentSlug,
            newUrl: newUrl,
            memo: memo,
            ...authBody
          })
        });
        const data = await res.json();

        if (!data.ok || !data.item) {
          setAlert(data.error || "更新に失敗しました。もう一度お試しください", "error");
          return;
        }

        currentUrlText.textContent = data.item.url;
        setAlert("転送先URLを更新しました。短縮URL（短縮.top/" + currentSlug + "）はそのまま新しい宛先へ転送されます。", "success");
      } catch (err) {
        if (err.name === "NotAllowedError") {
          setAlert("パスキー認証がキャンセルされました", "error");
        } else {
          setAlert(err.message || "通信エラーが発生しました", "error");
        }
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "新しい宛先を保存";
      }
    });

    function resetAll() {
      clearAlert();
      currentSlug = "";
      savedPassword = "";
      slugInput.disabled = false;
      passwordInput.value = "";
      checkBtn.style.display = "inline-flex";
      stepAuth.style.display = "none";
      stepEditor.style.display = "none";
    }

    backSlugBtn.addEventListener("click", resetAll);
    resetBtn.addEventListener("click", resetAll);
  </script>
</body>
</html>
